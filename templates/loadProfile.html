<!DOCTYPE html>

<html lang="en">

<!--
html page for /add/<name>, right now just take the name, sends POST request to add the name and then redirects to the profile page
-->

<head>
    <title>Loading Profile</title>
    <link rel="stylesheet" href="/static/css/main.css" />
</head>

<body>
    <header>
        <p>Tic-Tac-Toe Championships</p>
    </header>

    <br>
    <br>
    <p>Sign/Log In</p>
    <form action="/add" method="POST">
        <p>
            <label for="name">Profile Name:</label>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="text" id="password" name="password">
        </p>

        <button type="submit">Go</button>
    </form>

    <script src="/static/js/loadProfile.js"></script>
</body>
